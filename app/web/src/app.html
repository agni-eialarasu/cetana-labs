<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cetana Labs Control Hub — executive engineering portfolio dashboard."
    />
    <script>
      // Apply persisted / system theme before paint to avoid flash (dark-first).
      try {
        const t = localStorage.getItem('cetana-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          t === 'light' || t === 'dark' ? t : sysDark ? 'dark' : 'light'
        );
      } catch (e) {
        /* keep default dark */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
