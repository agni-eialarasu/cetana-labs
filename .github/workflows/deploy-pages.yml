name: Deploy Portfolio Dashboard + Sleek UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'projects/**'
      - 'scripts/**'
      - 'docs/**'
      - 'data/**'
      - 'app/web/**'
      - 'README.md'
      - 'STATUS.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Site layout (dual-run per RFC-LAB-000-005 §6):
#   /            -> classic static dashboard (docs/index.html)
#   /app/        -> SvelteKit "Sleek UI" (app/web build)
env:
  # GitHub Pages project site is served under /cetana-labs/; the app lives at /cetana-labs/app.
  APP_BASE_PATH: /cetana-labs/app

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cetana Labs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Portfolio Integrity Validator
        run: python3 scripts/validate_portfolio.py

      - name: Refresh live status snapshot (data/status.json)
        run: python3 scripts/generate_status_json.py

      - name: Generate Static Portfolio Dashboard
        run: python3 scripts/generate_dashboard.py

      # --- Sleek UI (SvelteKit) build ---
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app/web

      - name: Build Sleek UI (subpath base)
        run: pnpm build
        working-directory: app/web
        env:
          BASE_PATH: ${{ env.APP_BASE_PATH }}

      # --- Assemble the combined site artifact ---
      - name: Assemble site (root dashboard + /app SvelteKit)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/app
          cp -r app/web/build/. _site/app/
          echo "Assembled site:" && ls -la _site && echo "app/:" && ls -la _site/app | head

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
